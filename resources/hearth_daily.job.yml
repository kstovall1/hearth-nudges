# The daily flow: copy yesterday's console approvals to Delta, create mask and copy functions, then the pipeline,
# the metric views Genie reads, lapse scoring, the nudge picker and copy, the Lakebase syncs and a notification
# service check, alongside the catalog grant and column tags. The schedule stays paused; run it by hand.
resources:
  jobs:
    hearth_daily:
      name: hearth-daily
      schedule:
        quartz_cron_expression: "0 0 9 * * ?"  # 09:00 UTC, after the messaging tool's 07:00 batch
        timezone_id: UTC
        pause_status: PAUSED
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: score_days
          default: "1"  # days of lapse scores to write, more to backfill
        - name: value_of_reach
          default: "2.0"  # one opt-out costs as much as this many comebacks. A business estimate
      tasks:
        - task_key: copy_back_approvals
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/hearth_serving/copy_back_approvals.sql
            parameters:
              catalog: "{{job.parameters.catalog}}"

        - task_key: create_masks
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/hearth_governance/masks.sql
            parameters:
              catalog: "{{job.parameters.catalog}}"

        - task_key: refresh_pipeline
          depends_on:
            - task_key: create_masks
          pipeline_task:
            pipeline_id: ${resources.pipelines.hearth_pipeline.id}

        - task_key: create_metric_views
          depends_on:
            - task_key: refresh_pipeline
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/hearth_semantic/metric_views.sql
            parameters:
              catalog: "{{job.parameters.catalog}}"

        - task_key: score_lapse
          depends_on:
            - task_key: refresh_pipeline
          max_retries: 0
          environment_key: ml
          notebook_task:
            notebook_path: ../src/hearth_ml/score_lapse.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              model_name: lapse_model
              days: "{{job.parameters.score_days}}"

        - task_key: pick_nudges
          depends_on:
            - task_key: score_lapse
          max_retries: 0
          environment_key: ml
          notebook_task:
            notebook_path: ../src/hearth_ml/pick_nudges.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              value_of_reach: "{{job.parameters.value_of_reach}}"

        - task_key: create_copy_functions
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/hearth_genai/functions.sql
            parameters:
              catalog: "{{job.parameters.catalog}}"

        - task_key: write_copy
          depends_on:
            - task_key: pick_nudges
            - task_key: create_copy_functions
          max_retries: 0  # each attempt calls two models for every send
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/hearth_genai/copy.sql
            parameters:
              catalog: "{{job.parameters.catalog}}"

        - task_key: sync_lakebase
          depends_on:
            - task_key: write_copy
          pipeline_task:
            pipeline_id: ${var.nba_sync_pipeline}

        - task_key: sync_segments
          depends_on:
            - task_key: pick_nudges
          pipeline_task:
            pipeline_id: ${var.segments_sync_pipeline}

        - task_key: simulate_notification_service
          depends_on:
            - task_key: sync_lakebase
            - task_key: sync_segments
          max_retries: 0
          environment_key: serving
          notebook_task:
            notebook_path: ../src/hearth_serving/notification_simulator_job.py
            base_parameters:
              lookups: "500"

        - task_key: apply_access
          depends_on:
            - task_key: refresh_pipeline
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/hearth_governance/access.sql
            parameters:
              catalog: "{{job.parameters.catalog}}"
      environments:
        - environment_key: ml
          spec:
            client: "4"
            dependencies:
              - mlflow>=3.1
              - scikit-learn>=1.5
              - scipy>=1.11
        - environment_key: serving
          spec:
            client: "4"
            dependencies:
              - psycopg[binary]>=3.2
              - databricks-sdk>=0.81
