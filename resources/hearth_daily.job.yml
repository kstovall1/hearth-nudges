# The daily flow: mask functions, then the pipeline, then lapse scoring and the catalog grant and column
# tags. The nudge picker, copy and the Lakebase sync join in later Phase 2 steps. The schedule stays paused
# until the flow is complete; run it by hand meanwhile.
resources:
  jobs:
    hearth_daily:
      name: hearth-daily
      schedule:
        quartz_cron_expression: "0 0 9 * * ?"  # 09:00 UTC, after the messaging tool's 07:00 batch
        timezone_id: UTC
        pause_status: PAUSED
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: score_days
          default: "1"  # days of lapse scores to write, more to backfill
      tasks:
        - task_key: create_masks
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/hearth_governance/masks.sql
            parameters:
              catalog: "{{job.parameters.catalog}}"

        - task_key: refresh_pipeline
          depends_on:
            - task_key: create_masks
          pipeline_task:
            pipeline_id: ${resources.pipelines.hearth_pipeline.id}

        - task_key: score_lapse
          depends_on:
            - task_key: refresh_pipeline
          max_retries: 0
          environment_key: ml
          notebook_task:
            notebook_path: ../src/hearth_ml/score_lapse.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              model_name: lapse_model
              days: "{{job.parameters.score_days}}"

        - task_key: apply_access
          depends_on:
            - task_key: refresh_pipeline
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/hearth_governance/access.sql
            parameters:
              catalog: "{{job.parameters.catalog}}"
      environments:
        - environment_key: ml
          spec:
            client: "4"
            dependencies:
              - mlflow>=3.1
              - scikit-learn>=1.5
