# The daily flow: mask functions, then the pipeline, then catalog grants and column tags. Scoring, the
# nudge picker, copy and the Lakebase sync join in later phases. The schedule stays paused until the
# flow is complete; run it by hand meanwhile.
resources:
  jobs:
    hearth_daily:
      name: hearth-daily
      schedule:
        quartz_cron_expression: "0 0 9 * * ?"  # 09:00 UTC, after the messaging tool's 07:00 batch
        timezone_id: UTC
        pause_status: PAUSED
      parameters:
        - name: catalog
          default: ${var.catalog}
      tasks:
        - task_key: create_masks
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/hearth_governance/masks.sql
            parameters:
              catalog: "{{job.parameters.catalog}}"

        - task_key: refresh_pipeline
          depends_on:
            - task_key: create_masks
          pipeline_task:
            pipeline_id: ${resources.pipelines.hearth_pipeline.id}

        - task_key: apply_access
          depends_on:
            - task_key: refresh_pipeline
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/hearth_governance/access.sql
            parameters:
              catalog: "{{job.parameters.catalog}}"
