[project]
name = "hearth-data"
version = "0.1.0"
description = "Synthetic data generator for the Hearth Nudges build"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
]

[project.optional-dependencies]
spark = ["faker>=24"]

[project.scripts]
hearth-generate = "hearth_data.generate:main"
hearth-sim-check = "hearth_data.check:main"

[dependency-groups]
dev = [
    "faker>=24",
    "databricks-connect>=16.4,<17.4",
    "scipy>=1.18.1",
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hearth_data"]

[tool.pytest.ini_options]
markers = ["slow: runs the full 60-day simulation (about 30 seconds)"]
