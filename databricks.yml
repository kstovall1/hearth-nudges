# Hearth Nudges bundle. Every phase deploys through this file.
bundle:
  name: hearth-nudges

include:
  - resources/*.yml

artifacts:
  hearth_data:
    type: whl
    build: uv build --wheel
    path: .
    dynamic_version: true  # a new version per deploy, so serverless doesn't reuse a cached wheel

variables:
  catalog:
    description: Unity Catalog for Hearth resources (no CREATE CATALOG on this metastore)
    default: katie_febar_catalog
  lapse_model_version:
    description: Version of hearth_ml.lapse_model the serving endpoint serves. Set it to the champion version
    default: "5"
  nba_sync_pipeline:
    description: The pipeline behind the hearth_lakebase.hearth.next_best_action synced table, made by create-synced-table
    lookup:
      pipeline: "Synced table: hearth_lakebase.hearth.next_best_action y20Od6"
  genie_space_id:
    description: >-
      The Hearth Campaigns Genie space. Set in the gitignored .databricks/bundle/dev/variable-overrides.json by
      scripts/set_bundle_overrides.py, which finds the space by title, so the id stays out of the repo.
  segments_sync_pipeline:
    description: The pipeline behind the hearth_lakebase.hearth.member_segments synced table, made by create-synced-table
    lookup:
      pipeline: "Synced table: hearth_lakebase.hearth.member_segments vT3nwp"
  warehouse_id:
    description: SQL warehouse for the job's SQL tasks
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  # No development mode, so schema names stay exact (no dev_<user>_ prefix).
  dev:
    default: true
    workspace:
      profile: fevm-katie-febar
