# Hearth Nudges bundle. Every phase deploys through this file.
bundle:
  name: hearth-nudges

include:
  - resources/*.yml

artifacts:
  hearth_data:
    type: whl
    build: uv build --wheel
    path: .
    dynamic_version: true  # a new version per deploy, so serverless doesn't reuse a cached wheel

variables:
  catalog:
    description: Unity Catalog for Hearth resources (no CREATE CATALOG on this metastore)
    default: katie_febar_catalog
  lapse_model_version:
    description: Version of hearth_ml.lapse_model the serving endpoint serves. Set it to the champion version
    default: "5"
  warehouse_id:
    description: SQL warehouse for the job's SQL tasks
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  # No development mode, so schema names stay exact (no dev_<user>_ prefix).
  dev:
    default: true
    workspace:
      profile: fevm-katie-febar
